{{- if .Values.prometheusRule.enabled }}
{{- $annotationKeys := .Values.prometheusRule.annotationKeys | default dict }}
{{- $summaryKey := $annotationKeys.summary | default "summary" }}
{{- $descriptionKey := $annotationKeys.description | default "description" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "proxmox-exporter.fullname" . }}
  labels:
    {{- include "proxmox-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ProxmoxNodes
      rules:
        {{- with .Values.prometheusRule.additionalRules }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.prometheusRule.enableBuiltinRules }}
        - alert: ProxmoxNodeDown
          annotations:
            {{ $summaryKey }}: Proxmox node {{ printf "{{ $labels.node }}" }} is down
            {{ $descriptionKey }}: Check the alerting Proxmox host
          expr: |
            proxmox_node_up == 0
          for: 1m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxNodeMetricsLost
          annotations:
            {{ $summaryKey }}: Proxmox node {{ printf "{{ $labels.node }}" }} is missing from exporter metrics
            {{ $descriptionKey }}: Node {{ printf "{{ $labels.node }}" }} was reported within the last hour but no longer is. The node may have been removed from the cluster, or the exporter may be failing to query the Proxmox API
          expr: |
            max_over_time(proxmox_node_up[1h]) unless proxmox_node_up
          for: 5m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxExporterMetricsAbsent
          annotations:
            {{ $summaryKey }}: No Proxmox node metrics are being collected
            {{ $descriptionKey }}: proxmox_node_up has been absent for 10 minutes. Check the exporter pod, its connection to the Proxmox API, and the ServiceMonitor scraping it
          expr: |
            absent_over_time(proxmox_node_up[5m])
          for: 5m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxGuestDown
          annotations:
            {{ $summaryKey }}: Proxmox guest {{ printf "{{ $labels.name }}" }} is down
            {{ $descriptionKey }}: Guest {{ printf "{{ $labels.name }}" }} of type {{ printf "{{ $labels.type }}" }} on node {{ printf "{{ $labels.node }}" }} is down
          expr: |
            proxmox_guest_up == 0
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxGuestMetricsLost
          annotations:
            {{ $summaryKey }}: Proxmox guest {{ printf "{{ $labels.name }}" }} is missing from exporter metrics
            {{ $descriptionKey }}: Guest {{ printf "{{ $labels.name }}" }} ({{ printf "{{ $labels.type }}" }} {{ printf "{{ $labels.vmid }}" }}) was reported within the last hour but no longer is. This is expected for up to an hour after a guest is deleted
          expr: |
            max_over_time(proxmox_guest_up[1h]) unless ignoring(node, name, tags) proxmox_guest_up
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxDiskUnhealthy
          annotations:
            {{ $summaryKey }}: Proxmox disk {{ printf "{{ $labels.devpath }}" }} is unhealthy
            {{ $descriptionKey }}: The disk {{ printf "{{ $labels.devpath }}" }} in node {{ printf "{{ $labels.node }}" }} is reporting unhealthy in SMART tests
          expr: |
            proxmox_node_disk_smart_status == 0
          for: 1m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxDiskMetricsLost
          annotations:
            {{ $summaryKey }}: Proxmox disk {{ printf "{{ $labels.devpath }}" }} is missing from exporter metrics
            {{ $descriptionKey }}: The disk {{ printf "{{ $labels.devpath }}" }} in node {{ printf "{{ $labels.node }}" }} was reported within the last hour but no longer is. It may have failed, been removed, or been renamed after a reboot
          expr: |
            max_over_time(proxmox_node_disk_smart_status[1h]) unless proxmox_node_disk_smart_status
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxCertificateExpiring
          annotations:
            {{ $summaryKey }}: Proxmox certificate on node {{ printf "{{ $labels.node }}" }} is expiring in a week
            {{ $descriptionKey }}: The certificate with subject {{ printf "{{ $labels.subject }}" }} on that node is expiring in {{ printf "{{ $value }}" }} days
          expr: |
            proxmox_node_days_until_cert_expiration < {{ .Values.prometheusRule.threshold_ProxmoxCertificateExpiring | default 7 }}
          for: 5m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxCertificateExpiringWarning
          annotations:
            {{ $summaryKey }}: Proxmox certificate on node {{ printf "{{ $labels.node }}" }} is expiring soon
            {{ $descriptionKey }}: The certificate with subject {{ printf "{{ $labels.subject }}" }} on that node is expiring in {{ printf "{{ $value }}" }} days
          expr: |
            proxmox_node_days_until_cert_expiration < {{ .Values.prometheusRule.threshold_ProxmoxCertificateExpiringWarning | default 14 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxUnsharedStorageNearlyFull
          annotations:
            {{ $summaryKey }}: Proxmox storage volume {{ printf "{{ $labels.node }}" }}/{{ printf "{{ $labels.storage }}" }} nearly full
            {{ $descriptionKey }}: Volume {{ printf "{{ $labels.storage }}" }} of type {{ printf "{{ $labels.type }}" }} on node {{ printf "{{ $labels.node }}" }} is {{ printf "{{ $value }}" }}% full
          expr: |
            100 * (sum by (storage,node,type) (proxmox_node_storage_used_bytes{shared="false"}) / sum by (storage,node,type) (proxmox_node_storage_total_bytes{shared="false"})) > {{ .Values.prometheusRule.threshold_ProxmoxUnsharedStorageNearlyFull | default 90 }}
          for: 5m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxUnsharedStorageFilling
          annotations:
            {{ $summaryKey }}: Proxmox storage volume {{ printf "{{ $labels.node }}" }}/{{ printf "{{ $labels.storage }}" }} filling up
            {{ $descriptionKey }}: Volume {{ printf "{{ $labels.storage }}" }} of type {{ printf "{{ $labels.type }}" }} on node {{ printf "{{ $labels.node }}" }} is {{ printf "{{ $value }}" }}% full
          expr: |
            100 * (sum by (storage,node,type) (proxmox_node_storage_used_bytes{shared="false"}) / sum by (storage,node,type) (proxmox_node_storage_total_bytes{shared="false"})) > {{ .Values.prometheusRule.threshold_ProxmoxUnsharedStorageFilling | default 80 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxSharedStorageNearlyFull
          annotations:
            {{ $summaryKey }}: Proxmox shared storage volume {{ printf "{{ $labels.storage }}" }} nearly full
            {{ $descriptionKey }}: Shared volume {{ printf "{{ $labels.storage }}" }} of type {{ printf "{{ $labels.type }}" }} is {{ printf "{{ $value }}" }}% full
          expr: |
            100 * (sum by (storage,type) (proxmox_node_storage_used_bytes{shared="true"}) / sum by (storage,type) (proxmox_node_storage_total_bytes{shared="true"})) > {{ .Values.prometheusRule.threshold_ProxmoxSharedStorageNearlyFull | default 90 }}
          for: 5m
          labels:
            severity: critical
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxSharedStorageFilling
          annotations:
            {{ $summaryKey }}: Proxmox shared storage volume {{ printf "{{ $labels.storage }}" }} filling up
            {{ $descriptionKey }}: Shared volume {{ printf "{{ $labels.storage }}" }} of type {{ printf "{{ $labels.type }}" }} is {{ printf "{{ $value }}" }}% full
          expr: |
            100 * (sum by (storage,type) (proxmox_node_storage_used_bytes{shared="true"}) / sum by (storage,type) (proxmox_node_storage_total_bytes{shared="true"})) > {{ .Values.prometheusRule.threshold_ProxmoxSharedStorageFilling | default 80 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: ProxmoxCPUAllocationHigh
          annotations:
            {{ $summaryKey }}: Proxmox node {{ printf "{{ $labels.node }}" }} has {{ printf "{{ $value }}" }}% of its CPU allocated to guests
            {{ $descriptionKey }}: It is recommended to keep more of your node's CPU unallocated for use by PVE and other server applications your Proxmox node runs
          expr: |
            100 * (proxmox_node_cpus_allocated / proxmox_node_cpus_total) > {{ .Values.prometheusRule.threshold_ProxmoxCPUAllocationHigh | default 90 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ProxmoxMemoryAllocationHigh
          annotations:
            {{ $summaryKey }}: Proxmox node {{ printf "{{ $labels.node }}" }} has {{ printf "{{ $value }}" }}% of its memory allocated to guests
            {{ $descriptionKey }}: It is recommended to keep more of your node's memory unallocated for use by PVE and other server applications your Proxmox node runs
          expr: |
            100 * (proxmox_node_memory_allocated_bytes / proxmox_node_memory_total_bytes) > {{ .Values.prometheusRule.threshold_ProxmoxMemoryAllocationHigh | default 90 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.prometheusRule.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
{{- end }}
